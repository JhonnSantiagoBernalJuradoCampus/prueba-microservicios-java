spring:
  datasource:
    url: jdbc:h2:mem:products;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    org.springframework: INFO
security:
  api-key:
    enabled: true
    header: X-API-Key
    value: dev-secret
