spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/products_db
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
security:
  api-key:
    enabled: ${API_KEY_ENABLED:true}
    header: ${API_KEY_HEADER:X-API-Key}
    value: ${API_KEY_VALUE:prod-secret}
inventory:
  base-url: ${INVENTORY_BASE_URL:http://inventory:8082}
  api-key:
    header: ${INVENTORY_API_KEY_HEADER:X-API-Key}
    value: ${INVENTORY_API_KEY_VALUE:prod-secret}
